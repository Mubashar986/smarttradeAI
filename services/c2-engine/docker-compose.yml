services:
  c2-engine:
    build: .
    container_name: smarttrade-c2-engine
    ports:
      - "3000:3000"
    environment:
      # --- LLM Provider Config ---
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - CLAW_MODEL=${CLAW_MODEL:-llama-3.3-70b-versatile}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.groq.com/openai/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_NATIVE_KEY=${OPENAI_NATIVE_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - XAI_BASE_URL=${XAI_BASE_URL:-}
      # --- Engine Config ---
      - CLAW_MAX_TOKENS=${CLAW_MAX_TOKENS:-512}
      - CLAW_TEMPERATURE=${CLAW_TEMPERATURE:-0.2}
      - CLAW_MAX_TURN_ITERATIONS=${CLAW_MAX_TURN_ITERATIONS:-8}
      # --- Infrastructure ---
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://smarttrade:smarttrade@postgres:5432/smarttrade
      - STRATEGIES_DIR=/workspace/strategies
      # --- Optional auth for protected /v1 routes ---
      - C2_JWT_SECRET=${C2_JWT_SECRET:-}
      - C2_JWT_ISSUER=${C2_JWT_ISSUER:-}
      - C2_JWT_AUDIENCE=${C2_JWT_AUDIENCE:-}
      # --- Pinecone (optional) ---
      - PINECONE_API_KEY=${PINECONE_API_KEY:-}
      - PINECONE_INDEX=${PINECONE_INDEX:-mql5-docs}
      - PINECONE_NAMESPACE=${PINECONE_NAMESPACE:-mql5_templates}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./CLAW.md:/workspace/CLAW.md:ro
      - ./.claw/settings.json:/workspace/.claw/settings.json:ro
      - strategies-data:/workspace/strategies

  rust-dev:
    build:
      context: .
      target: builder
    profiles: ["dev"]
    working_dir: /workspace/rust
    volumes:
      - .:/workspace
      - cargo-target:/workspace/rust/target
    command: bash -lc "sleep infinity"

  redis:
    image: redis:7-alpine
    container_name: smarttrade-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: smarttrade-postgres
    environment:
      - POSTGRES_USER=smarttrade
      - POSTGRES_PASSWORD=smarttrade
      - POSTGRES_DB=smarttrade
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./plugins/smarttrade-mql5/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarttrade"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis-data:
  postgres-data:
  strategies-data:
  cargo-target:

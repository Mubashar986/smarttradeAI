<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">SmartTradeAI realtime frontend mockup</title>
  <desc id="desc">A concept UI showing chat input, SSE progress events, generated code, and validation results for the SmartTradeAI backend.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#10192d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151f35"/>
      <stop offset="100%" stop-color="#11192b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020611" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #f5f7fb; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #9fb0cc; }
      .section { font: 700 16px Arial, sans-serif; fill: #eef4ff; }
      .label { font: 600 13px Arial, sans-serif; fill: #c8d4ea; }
      .text { font: 400 14px Arial, sans-serif; fill: #dfe8f7; }
      .small { font: 400 12px Arial, sans-serif; fill: #9fb0cc; }
      .mono { font: 400 12px Consolas, "Courier New", monospace; fill: #d8e4ff; }
      .pill { font: 600 12px Arial, sans-serif; fill: #f4f8ff; }
      .event { font: 600 12px Consolas, "Courier New", monospace; fill: #eff5ff; }
      .mutedEvent { font: 400 12px Consolas, "Courier New", monospace; fill: #9fb0cc; }
    </style>
  </defs>

  <rect width="1600" height="960" fill="url(#bg)"/>

  <text x="64" y="72" class="title">SmartTradeAI realtime UI concept</text>
  <text x="64" y="102" class="subtitle">HTTP sends commands. SSE pushes live progress. WebSocket stays optional for richer future interaction.</text>

  <!-- Left rail -->
  <g filter="url(#shadow)">
    <rect x="52" y="138" width="232" height="770" rx="18" fill="url(#panel)" stroke="#24324f"/>
  </g>
  <text x="78" y="182" class="section">Conversations</text>

  <rect x="76" y="206" width="184" height="58" rx="14" fill="#1d3355" stroke="#2f4f7e"/>
  <text x="92" y="230" class="label">session-12</text>
  <text x="92" y="250" class="small">BUY EURUSD H1 strategy</text>

  <rect x="76" y="278" width="184" height="58" rx="14" fill="#151f35" stroke="#253450"/>
  <text x="92" y="302" class="label">session-11</text>
  <text x="92" y="322" class="small">Clarification loop</text>

  <rect x="76" y="350" width="184" height="58" rx="14" fill="#151f35" stroke="#253450"/>
  <text x="92" y="374" class="label">session-10</text>
  <text x="92" y="394" class="small">Backtest review</text>

  <rect x="76" y="824" width="184" height="50" rx="12" fill="#1a8d73"/>
  <text x="121" y="855" class="pill">+ New conversation</text>

  <!-- Center chat area -->
  <g filter="url(#shadow)">
    <rect x="316" y="138" width="748" height="770" rx="18" fill="url(#panel)" stroke="#24324f"/>
  </g>

  <text x="348" y="182" class="section">C1 Chat Interface</text>
  <text x="348" y="206" class="small">Primary command flow: POST /v1/sessions, POST /v1/sessions/{id}/turn, GET /v1/tasks/{task_id}</text>

  <rect x="348" y="226" width="120" height="28" rx="14" fill="#22395f"/>
  <text x="374" y="245" class="pill">session-12</text>
  <rect x="478" y="226" width="94" height="28" rx="14" fill="#1f6f92"/>
  <text x="509" y="245" class="pill">SSE primary</text>
  <rect x="582" y="226" width="140" height="28" rx="14" fill="#8a5a1f"/>
  <text x="611" y="245" class="pill">task-44 running</text>

  <rect x="348" y="280" width="684" height="500" rx="18" fill="#0f1728" stroke="#20304a"/>

  <!-- Message bubbles -->
  <rect x="384" y="320" width="438" height="88" rx="18" fill="#153455"/>
  <text x="408" y="350" class="label">User</text>
  <text x="408" y="376" class="text">Build a BUY EURUSD H1 strategy when the 50 SMA</text>
  <text x="408" y="398" class="text">crosses above the 200 SMA with reverse cross exit</text>
  <text x="408" y="420" class="text">and stop-loss 50 pips.</text>

  <rect x="556" y="444" width="436" height="96" rx="18" fill="#1d2741"/>
  <text x="580" y="474" class="label">Assistant</text>
  <text x="580" y="500" class="text">I generated an MQL5 draft using the sma_crossover</text>
  <text x="580" y="522" class="text">skeleton and static analysis passed. Compilation and</text>
  <text x="580" y="544" class="text">persistence are the next integration steps.</text>

  <rect x="384" y="576" width="374" height="72" rx="18" fill="#153455"/>
  <text x="408" y="606" class="label">User</text>
  <text x="408" y="632" class="text">Explain this generated strategy in simple terms.</text>

  <rect x="556" y="670" width="436" height="84" rx="18" fill="#1d2741"/>
  <text x="580" y="700" class="label">Assistant</text>
  <text x="580" y="726" class="text">The system sees a bullish moving-average crossover,</text>
  <text x="580" y="748" class="text">opens a buy trade, and closes it on the reverse cross.</text>

  <rect x="348" y="804" width="684" height="76" rx="16" fill="#0f1728" stroke="#20304a"/>
  <text x="374" y="836" class="small">User types strategy or clarification answer here...</text>
  <rect x="904" y="822" width="106" height="40" rx="12" fill="#1a8d73"/>
  <text x="944" y="848" class="pill">Send</text>

  <!-- Right rail -->
  <g filter="url(#shadow)">
    <rect x="1096" y="138" width="452" height="770" rx="18" fill="url(#panel)" stroke="#24324f"/>
  </g>
  <text x="1128" y="182" class="section">C2 live engine view</text>
  <text x="1128" y="206" class="small">SSE pushes status updates while the task runs. HTTP remains the command channel.</text>

  <!-- Event stream -->
  <rect x="1128" y="232" width="388" height="296" rx="18" fill="#0f1728" stroke="#20304a"/>
  <text x="1152" y="268" class="section">Event stream (/v1/sessions/{id}/events)</text>

  <rect x="1152" y="290" width="340" height="34" rx="10" fill="#202d45"/>
  <text x="1170" y="312" class="event">snapshot</text>
  <text x="1298" y="312" class="mutedEvent">initial session state</text>

  <rect x="1152" y="334" width="340" height="34" rx="10" fill="#17354f"/>
  <text x="1170" y="356" class="event">message</text>
  <text x="1298" y="356" class="mutedEvent">user turn appended</text>

  <rect x="1152" y="378" width="340" height="34" rx="10" fill="#7a4d16"/>
  <text x="1170" y="400" class="event">status: queued</text>
  <text x="1298" y="400" class="mutedEvent">task accepted</text>

  <rect x="1152" y="422" width="340" height="34" rx="10" fill="#1d6b86"/>
  <text x="1170" y="444" class="event">status: running</text>
  <text x="1298" y="444" class="mutedEvent">worker processing</text>

  <rect x="1152" y="466" width="340" height="34" rx="10" fill="#215a40"/>
  <text x="1170" y="488" class="event">generated_code</text>
  <text x="1298" y="488" class="mutedEvent">code payload ready</text>

  <rect x="1152" y="510" width="340" height="34" rx="10" fill="#5e3d71"/>
  <text x="1170" y="532" class="event">validation_feedback</text>
  <text x="1298" y="532" class="mutedEvent">analysis passed</text>

  <!-- Code panel -->
  <rect x="1128" y="554" width="388" height="212" rx="18" fill="#0f1728" stroke="#20304a"/>
  <text x="1152" y="590" class="section">Generated strategy</text>
  <rect x="1372" y="572" width="120" height="28" rx="14" fill="#1a8d73"/>
  <text x="1405" y="591" class="pill">ready_for_compile</text>
  <text x="1156" y="628" class="mono">#property strict</text>
  <text x="1156" y="650" class="mono">input int FastMAPeriod = 50;</text>
  <text x="1156" y="672" class="mono">input int SlowMAPeriod = 200;</text>
  <text x="1156" y="694" class="mono">bool goldenCross = fastMA[1] &gt; slowMA[1]</text>
  <text x="1156" y="716" class="mono">&amp;&amp; fastMA[0] &lt;= slowMA[0];</text>
  <text x="1156" y="738" class="mono">trade.Buy(LotSize, _Symbol, ask, sl, tp,</text>
  <text x="1156" y="760" class="mono">"SMA Golden Cross");</text>

  <!-- Task and transport explainer -->
  <rect x="1128" y="792" width="388" height="88" rx="18" fill="#101a2d" stroke="#20304a"/>
  <text x="1152" y="824" class="label">Why SSE exists here</text>
  <text x="1152" y="848" class="text">HTTP sends the command once. SSE keeps the UI updated while</text>
  <text x="1152" y="868" class="text">the async task moves from queued to running to complete.</text>
</svg>
